#
# Run the host unit and tooling suites (check-unit) on macOS for every branch
# other than main, so a CPU-engine change is tested before it reaches the IPA.
name: Unit tests

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-unit:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          brew install ninja make meson pkg-config rsync autoconf automake gettext libtool gperf groff
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Restore dependency prefix
        id: deps
        uses: actions/cache@v4
        with:
          path: .build/dependencies
          key: macos-deps-${{ hashFiles('dependencies/**') }}
      - name: Restore dependency Git cache
        uses: actions/cache@v4
        with:
          path: .build/dependency-cache
          key: dependency-git-${{ hashFiles('dependencies/manifest.tsv') }}
          restore-keys: dependency-git-
      # Savannah answers 502 intermittently, so a failed fetch is retried.
      - name: Prepare dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            dependencies/prepare.sh --product macos && exit 0
            sleep $((attempt * 30))
          done
          exit 1
      - name: Build dependency prefix
        if: steps.deps.outputs.cache-hit != 'true'
        run: dependencies/build.sh --jobs "$(sysctl -n hw.logicalcpu)"
      - name: Run check-unit
        run: cmake --workflow --preset check-unit
