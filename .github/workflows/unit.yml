#
# Run the host unit and tooling suites (check-unit) on macOS for every branch
# other than main, so a CPU-engine change is tested before it reaches the IPA.
name: Unit tests

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-unit:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: brew install ninja autoconf automake libtool meson pkg-config
      - name: Restore dependency prefix
        id: deps
        uses: actions/cache@v4
        with:
          path: .build/dependencies
          key: macos-deps-${{ hashFiles('dependencies/**') }}
      - name: Prepare dependencies
        run: dependencies/prepare.sh --product macos
      - name: Build dependency prefix
        if: steps.deps.outputs.cache-hit != 'true'
        run: dependencies/build.sh --jobs "$(sysctl -n hw.logicalcpu)"
      - name: Run check-unit
        run: cmake --workflow --preset check-unit
