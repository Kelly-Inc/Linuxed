# SPDX-License-Identifier: GPL-2.0-or-later
#
# Build starter products (tools/rootfs/starter) and attach them to the
# `ci-inputs` release. Buildroot output is not byte-reproducible, so a new boot
# base is accepted only by committing its size and SHA-256 in
# tools/rootfs/boot-ramdisk/accepted-aarch64.env.
name: Starter images

on:
  workflow_dispatch:
    inputs:
      products:
        description: Space-separated starter products
        default: boot-base-aarch64
        required: true
      release:
        description: Release tag the images are attached to
        default: ci-inputs
        required: true
  # Image workflows call this one with their product and release.
  workflow_call:
    inputs:
      products:
        type: string
        required: true
      release:
        type: string
        required: true
      r2:
        description: Keep the images in the R2 bucket, as a cache and under images/ (R2_* secrets)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  starter:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTS: ${{ inputs.products }}
      RELEASE: ${{ inputs.release }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore built images from R2
        id: images
        if: inputs.r2
        env:
          # A product rebuilds only when its producer changes.
          CACHE_KEY: cache/images/${{ inputs.products }}-${{ hashFiles('tools/rootfs/starter/**', 'tools/rootfs/desktop/**', 'tools/video/**') }}.tar
        run: |
          if .github/scripts/r2.sh has "$CACHE_KEY"; then
            .github/scripts/r2.sh get "$CACHE_KEY" "$RUNNER_TEMP/images.tar"
            mkdir -p "$RUNNER_TEMP/release"
            tar -xf "$RUNNER_TEMP/images.tar" -C "$RUNNER_TEMP/release"
            rm -f "$RUNNER_TEMP/images.tar"
            echo cache-hit=true >> "$GITHUB_OUTPUT"
          fi

      - name: Install producer tools
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio curl debootstrap e2fsprogs erofs-utils file gdisk rsync unzip wget

      - name: Build
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          set --
          for product in $PRODUCTS; do set -- "$@" --product "$product"; done
          tools/rootfs/starter/build-all.sh "$@" \
            --work "$RUNNER_TEMP/work" --output "$RUNNER_TEMP/release" --jobs "$(nproc)"
          ls -l "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && sha256sum *)

      - name: Attach to the release
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$RELEASE" -R "$GITHUB_REPOSITORY" --title "$RELEASE" --notes "Starter images built by the boot-base workflow."
          cd "$RUNNER_TEMP/release"
          files=$(ls *.cpio.gz *.erofs 2>/dev/null || true)
          test -n "$files"
          gh release upload "$RELEASE" -R "$GITHUB_REPOSITORY" $files --clobber

      - name: Save to the R2 cache
        if: inputs.r2
        env:
          # A product rebuilds only when its producer changes.
          CACHE_KEY: cache/images/${{ inputs.products }}-${{ hashFiles('tools/rootfs/starter/**', 'tools/rootfs/desktop/**', 'tools/video/**') }}.tar
        run: |
          # Cached images are in the bucket already, from the run that built them.
          [ "${{ steps.images.outputs.cache-hit }}" != true ] || exit 0
          tar -cf "$RUNNER_TEMP/images.tar" -C "$RUNNER_TEMP/release" .
          .github/scripts/r2.sh put "$CACHE_KEY" "$RUNNER_TEMP/images.tar"
          rm -f "$RUNNER_TEMP/images.tar"

      # Only a fresh build is handed on; a cached image is in R2 already.
      - uses: actions/upload-artifact@v4
        if: steps.images.outputs.cache-hit != 'true'
        with:
          name: starter-${{ inputs.release }}
          path: ${{ runner.temp }}/release
